[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-identification"
version = "0.2.0"
description = "Beginner-friendly face identification with a web GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
face-id = "face_id.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
